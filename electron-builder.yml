appId: com.finymark.financial-tracker
productName: Financial Tracker
directories:
  output: release
files:
  - out/**/*
  - '!node_modules/@tesseract.js-data/**/*'
extraResources:
  - from: build/icon.ico
    to: icon.ico
  - from: node_modules/financial-tracker-ocr-models
    to: ocr-models
asar: true
asarUnpack:
  - out/main/receipt-preprocessing-worker.js
  - node_modules/better-sqlite3/**/*.node
  # The preprocessing worker loads sharp from app.asar.unpacked, so its
  # runtime dependencies must be unpacked too.
  - node_modules/sharp/**/*
  - node_modules/@img/**/*
  - node_modules/detect-libc/**/*
  # Tesseract starts its Node adapter with worker_threads; worker code, WASM,
  # and its runtime dependency graph must be addressable outside app.asar.
  - node_modules/tesseract.js/**/*
  - node_modules/tesseract.js-core/**/*
  - node_modules/bmp-js/**/*
  - node_modules/idb-keyval/**/*
  - node_modules/is-url/**/*
  - node_modules/node-fetch/**/*
  - node_modules/regenerator-runtime/**/*
  - node_modules/tr46/**/*
  - node_modules/wasm-feature-detect/**/*
  - node_modules/webidl-conversions/**/*
  - node_modules/whatwg-url/**/*
  - node_modules/zlibjs/**/*
# better-sqlite3 ships a Node-API binary; do not run its legacy node-gyp script.
npmRebuild: false
win:
  icon: build/icon.ico
  target:
    - target: nsis
      arch: [x64]
  # Keep PE resource editing (icon and metadata), but do not code-sign releases.
  signAndEditExecutable: true
  signExecutable: false
  verifyUpdateCodeSignature: false
nsis:
  oneClick: true
  perMachine: false
  deleteAppDataOnUninstall: false
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  # No spaces: gh uploads assets under their file names, and latest.yml must
  # reference the same name for electron-updater.
  artifactName: Financial-Tracker-Setup-${version}.${ext}
publish:
  provider: github
  owner: finymark
  repo: financial-tracker
  releaseType: release
